name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    # Runs first and alone: a secret in a tracked file fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm test:secrets

  typescript:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:conformance
      - run: pnpm test:prove
      - run: pnpm test:retention

  circuits:
    # Rebuilds the aggregate circuits with the pinned toolchain and fails if the
    # pinned verification keys drift.
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install nargo 1.0.0-beta.11
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          "$HOME/.nargo/bin/noirup" -v 1.0.0-beta.11
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - run: pnpm build:circuits
      - run: git diff --exit-code -- circuits/

  contracts:
    needs: secrets
    runs-on: ubuntu-latest
    env:
      # What `stellar contract build` sets; lets plain cargo build the
      # OpenZeppelin crates that use spec shaking.
      SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test --manifest-path contracts/Cargo.toml
      - run: cargo build --manifest-path ct/contracts/Cargo.toml --target wasm32v1-none --release

  site:
    # Builds the landing page and docs (claims checked first), crawls the
    # result, and drives /verify in a browser: the published round verifies,
    # both tampering cases are rejected, an aged-out round is reported as such.
    # The site imports verify/core.ts, so the repository's packages are
    # installed too.
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - name: Crawl the built site and check the verifier
        working-directory: site
        run: |
          npx next start -p 3123 &
          for i in $(seq 1 60); do curl -sf http://localhost:3123 >/dev/null && break; sleep 1; done
          npm run check:site -- http://localhost:3123
          npm run check:verifier -- http://localhost:3123
