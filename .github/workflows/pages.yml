name: Redirect GitHub Pages to tally.0xo.in

# The site is served by Vercel at https://tally.0xo.in. This publishes a
# redirect page at the old GitHub Pages address, keeping the #anchor.
# Run it by hand once tally.0xo.in is live, so the old address never points
# at a domain that does not answer yet.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
